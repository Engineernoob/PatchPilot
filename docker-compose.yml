version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchpilot}
      POSTGRES_USER: ${POSTGRES_USER:-patchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-patchpilot}:${POSTGRES_PASSWORD:-patchpilot}@postgres:5432/${POSTGRES_DB:-patchpilot}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b-instruct-q8_0}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - ./data:/data
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      PATCHPILOT_API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    depends_on:
      - api

volumes:
  postgres_data:

